name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run synthetic compatibility tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q custom_components/fibaro_cloud tests/fibaro_cloud
      - name: Check isolated Home Assistant configuration
        shell: bash
        run: |
          CHECK_CONFIG=$(mktemp -d)
          mkdir -p "$CHECK_CONFIG/custom_components"
          cp -R custom_components/fibaro_cloud "$CHECK_CONFIG/custom_components/"
          printf '{}\n' > "$CHECK_CONFIG/configuration.yaml"
          python -m homeassistant --script check_config --config "$CHECK_CONFIG"
